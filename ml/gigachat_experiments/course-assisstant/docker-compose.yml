version: '3.8'

services:
  course-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-assistant
    ports:
      - "1340:8000"
    environment:
    - GIGACHAT_CLIENT_ID=${GIGACHAT_CLIENT_ID}
    - GIGACHAT_CLIENT_SECRET=${GIGACHAT_CLIENT_SECRET}
    restart: unless-stopped